<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TS Online - Cyber Quest Codex</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="cyber-container">
        <!-- Header ล้ำๆ -->
        <header class="cyber-header">
            <div class="logo-area">
                <h1>⚡ TS THAMMAI <span>CODEX</span></h1>
                <p>ระบบพัฒนาฐานข้อมูล และเส้นทางเควสเจาะลึก</p>
            </div>
            <div class="header-stats" id="totalStatsCounter">กำลังซิงค์ข้อมูล...</div>
        </header>

        <!-- ช่องค้นหาและฟิลเตอร์เรืองแสง -->
        <div class="control-panel">
            <div class="search-box-cyber">
                <span class="search-icon">🔍</span>
                <input type="text" id="searchInput" placeholder="ค้นหาชื่อภารกิจ, รหัส ID หรือเนื้อหาขั้นตอน..." onkeyup="filterQuests()">
            </div>
            <div class="filter-pills">
                <button class="pill-btn active" onclick="setFilter('all', event)">ทั้งหมด</button>
                <button class="pill-btn" onclick="setFilter('fight', event)">⚔️ เฉพาะบอส / ต่อสู้</button>
            </div>
        </div>

        <!-- พื้นที่แสดงการ์ดเควสแบบ Grid สมัยใหม่ -->
        <div class="quest-grid-container" id="questGrid">
            <!-- ข้อมูลจะถูกเรนเดอร์มาที่นี่ -->
        </div>
    </div>

    <!-- Modal รายละเอียดแบบ Hologram Popup -->
    <div id="cyberModal" class="cyber-modal-backdrop" style="display:none;" onclick="closeModalOnOutside(event)">
        <div class="cyber-modal-box">
            <div class="modal-top-bar">
                <span id="modalQuestId" class="modal-id-badge">ID: 00000</span>
                <button class="cyber-close-btn" onclick="closeModal()">&times;</button>
            </div>
            <h2 id="modalTitle" class="modal-title-text">ชื่อเควส</h2>
            <div id="modalBodyContent" class="modal-scroll-content">
                <!-- รายละเอียดสเต็ป -->
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
