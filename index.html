<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TS Online Encyclopedia - สารานุกรมเกม</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="site-container">
        <!-- แถบหัวเว็บ -->
        <header class="site-header">
            <h1>⚔️ TS Online Encyclopedia ⚔️</h1>
            <p>ระบบฐานข้อมูลและสารานุกรมเจาะลึก ข้อมูลจาก Client เกม</p>
        </header>

        <!-- แถบเลือกหมวดหมู่ข้อมูล -->
        <div class="category-tabs">
            <button class="tab-btn active" onclick="switchTab('talk', event)">💬 บทสนทนา/เควส</button>
            <button class="tab-btn" onclick="switchTab('item', event)">🛡️ ไอเทม</button>
            <button class="tab-btn" onclick="switchTab('npc', event)">👥 NPC</button>
            <button class="tab-btn" onclick="switchTab('scene', event)">🗺️ แผนที่/ฉาก</button>
        </div>

        <!-- ช่องค้นหาหลัก -->
        <div class="search-section">
            <input type="text" id="searchInput" placeholder="พิมพ์ชื่อไอเทม, NPC, สถานที่ หรือเนื้อหาเควสที่ต้องการค้นหา..." onkeyup="filterData()">
        </div>

        <div id="statsInfo" class="stats-info">กำลังโหลดข้อมูลฐานข้อมูล...</div>

        <!-- พื้นที่แสดงตารางผลลัพธ์ -->
        <div class="table-container">
            <table class="encyclopedia-table">
                <thead id="tableHeader">
                    <!-- หัวตารางจะเปลี่ยนไปตามหมวดหมู่ -->
                </thead>
                <tbody id="tableBody">
                    <!-- ข้อมูลจะถูกเติมด้วย JavaScript -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- Modal สำหรับดูรายละเอียดเชิงลึก -->
    <div id="detailModal" class="modal-overlay" style="display:none;">
        <div class="modal-box">
            <span class="close-btn" onclick="closeModal()">&times;</span>
            <h2 id="modalTitle">รายละเอียดข้อมูล</h2>
            <div id="modalContent" class="modal-body-content"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
