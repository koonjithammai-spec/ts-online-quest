<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TS Online Quest Encyclopedia - สารานุกรมเควส</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="site-container">
        <!-- แถบหัวเว็บ -->
        <header class="site-header">
            <h1>📜 TS Online Quest Encyclopedia 📜</h1>
            <p>ระบบฐานข้อมูลขั้นตอนและเส้นทางเดินเควสเชิงลึก</p>
        </header>

        <!-- ช่องค้นหาเควส -->
        <div class="search-section">
            <input type="text" id="searchInput" placeholder="พิมพ์ชื่อเควส, รหัส ID หรือเนื้อหาขั้นตอนเพื่อค้นหา..." onkeyup="searchQuests()">
        </div>

        <div id="statsInfo" class="stats-info">กำลังโหลดข้อมูลเควส...</div>

        <!-- พื้นที่แสดงผลรายการเควส -->
        <div id="questList" class="quest-list-container">
            <!-- ข้อมูลเควสจะแสดงที่นี่ -->
        </div>
    </div>

    <!-- Modal สำหรับแสดงขั้นตอนเควสแบบละเอียด -->
    <div id="detailModal" class="modal-overlay" style="display:none;">
        <div class="modal-box">
            <span class="close-btn" onclick="closeModal()">&times;</span>
            <h2 id="modalTitle">รายละเอียดเควส</h2>
            <div id="modalContent" class="modal-body-content"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
