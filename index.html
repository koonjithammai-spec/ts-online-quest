<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>สารานุกรมเควส - TS Arena</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <!-- แถบหัวเว็บด้านบน -->
    <header class="top-navbar">
        <div class="nav-title">
            <h2>📖 สารานุกรมเควส</h2>
            <span>TS Arena · ข้อมูลจาก Client</span>
        </div>
        <div class="nav-stats" id="totalStatsCounter">กำลังโหลด...</div>
    </header>

    <!-- เลย์เอาต์หลักแบ่งซ้าย-ขวา -->
    <div class="main-container">
        <!-- คอลัมน์ซ้าย: ช่องค้นหา ตัวกรอง และรายชื่อเควส -->
        <aside class="left-sidebar">
            <div class="tabs-switch">
                <button class="tab-btn active">เควส</button>
                <button class="tab-btn inactive" onclick="alert('กำลังพัฒนาส่วน NPC ที่สู้')">NPC ที่สู้</button>
            </div>

            <div class="search-box-area">
                <input type="text" id="searchInput" placeholder="พิมพ์ชื่อเควส หรือรหัส..." onkeyup="filterAndSearchQuests()">
            </div>

            <!-- ฟิลเตอร์กรองขั้นสูง -->
            <div class="filter-box">
                <div class="filter-row">
                    <label>จำนวนขั้นตอน</label>
                    <input type="number" id="minSteps" placeholder="ต่ำสุด" oninput="filterAndSearchQuests()">
                    <span>-</span>
                    <input type="number" id="maxSteps" placeholder="สูงสุด" oninput="filterAndSearchQuests()">
                </div>
                <div class="filter-row">
                    <label>จำนวนสู้ต่อไฟต์</label>
                    <input type="number" id="minFights" placeholder="ต่ำสุด" oninput="filterAndSearchQuests()">
                    <span>-</span>
                    <input type="number" id="maxFights" placeholder="สูงสุด" oninput="filterAndSearchQuests()">
                </div>
            </div>

            <div class="results-count" id="resultCountText">แสดงทั้งหมด 0 ผลลัพธ์</div>

            <!-- รายการรายชื่อเควสฝั่งซ้าย -->
            <div class="quest-sidebar-list" id="sidebarQuestList">
                <!-- รายการจะถูกเติมด้วย JavaScript -->
            </div>
        </aside>

        <!-- คอลัมน์ขวา: พื้นที่แสดงรายละเอียดเควสที่เลือก (Timeline) -->
        <main class="right-content" id="rightDetailArea">
            <div class="welcome-pane">
                <h2>👈 กรุณาเลือกเควสจากรายการด้านซ้าย</h2>
                <p>เพื่อดูขั้นตอนการเดินเควส รายละเอียดแผนที่ และจุดปะทะทั้งหมด</p>
            </div>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
