<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TS Online Elite Quest Codex - สารานุกรมเควสขั้นเทพ</title>
    <link rel="stylesheet" href="style.css">
    <!-- Google Fonts สำหรับฟอนต์เกมมิ่งทันสมัย -->
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-layout">
        <!-- Sidebar ด้านซ้ายสำหรับเลือกหมวด / กรองข้อมูล -->
        <aside class="sidebar">
            <div class="logo-area">
                <h2>⚔️ TS CODEX</h2>
                <span>Ultimate Quest Database</span>
            </div>
            <nav class="nav-menu">
                <button class="nav-btn active" onclick="filterCategory('all', event)">📜 เควสเนื้อเรื่องทั้งหมด</button>
                <button class="nav-btn" onclick="filterCategory('fight', event)">⚔️ เฉพาะเควสต่อสู้ (Boss)</button>
            </nav>
            <div class="sidebar-footer">
                <p>ฐานข้อมูล Client อัปเดตล่าสุด</p>
            </div>
        </aside>

        <!-- พื้นที่เนื้อหาหลักด้านขวา -->
        <main class="main-content">
            <header class="top-header">
                <div class="search-box">
                    <input type="text" id="searchInput" placeholder="ค้นหาชื่อเควส, ไอดี, มอนสเตอร์ หรือเนื้อหาขั้นตอน..." onkeyup="searchQuests()">
                </div>
                <div class="user-badge"><span>🌐 Online Database</span></div>
            </header>

            <div class="content-body">
                <div class="stats-bar" id="statsInfo">กำลังโหลดข้อมูลระบบ...</div>
                
                <!-- ตารางแสดงผลสไตล์ Modern Table ผสมการ์ด -->
                <div class="table-card-wrapper">
                    <table class="modern-table">
                        <thead>
                            <tr>
                                <th width="12%">รหัส ID</th>
                                <th width="28%">ชื่อเควส / ภารกิจ</th>
                                <th width="45%">ขั้นตอนสำคัญ / จุดปะทะ</th>
                                <th width="15%">สถานะ</th>
                            </tr>
                        </thead>
                        <tbody id="questTableBody">
                            <!-- ข้อมูลสอดแทรกด้วย JS -->
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <!-- Modal Popup สำหรับดูรายละเอียดสเต็ปการเดินเควสแบบละเอียดยิบ -->
    <div id="questModal" class="modal-backdrop" style="display:none;">
        <div class="modal-container">
            <div class="modal-header">
                <h3 id="modalQuestTitle">รายละเอียดเควส</h3>
                <button class="close-x" onclick="closeModal()">&times;</button>
            </div>
            <div class="modal-body" id="modalQuestBody">
                <!-- รายละเอียดสเต็ปย่อย -->
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
